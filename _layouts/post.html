---
layout: default
---
<article class="content-card post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        <svg class="icon-calendar" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2"></rect>
          <path d="M16 2v4M8 2v4M3 10h18"></path>
        </svg>
        {{ page.date | date: "%Y年%-m月%-d日" }}
      </time>
      {% if page.tags.size > 0 %}
        <div class="post-card-tags">
          {% for tag in page.tags %}
            <a class="tag-pill" href="{{ '/tags.html#' | append: tag | relative_url }}">{{ tag }}</a>
          {% endfor %}
        </div>
      {% endif %}
    </div>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
