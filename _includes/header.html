<header class="site-header">
  <div class="container header-inner">
    <div class="header-left">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>博客</a>
        <a href="{{ '/about.html' | relative_url }}" {% if page.url == '/about.html' %}class="active"{% endif %}>关于</a>
        <a href="{{ '/tags.html' | relative_url }}" {% if page.url == '/tags.html' %}class="active"{% endif %}>标签</a>
        <a href="{{ '/search.html' | relative_url }}" {% if page.url == '/search.html' %}class="active"{% endif %}>搜索</a>
      </nav>
    </div>
    <div class="header-right">
      <a class="icon-btn" href="{{ '/feed.xml' | relative_url }}" title="RSS" aria-label="RSS">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 11a9 9 0 0 1 9 9"></path>
          <path d="M4 4a16 16 0 0 1 16 16"></path>
          <circle cx="5" cy="19" r="1" fill="currentColor"></circle>
        </svg>
      </a>
      <a class="icon-btn" href="{{ '/search.html' | relative_url }}" title="搜索" aria-label="搜索">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
      </a>
    </div>
  </div>
</header>
